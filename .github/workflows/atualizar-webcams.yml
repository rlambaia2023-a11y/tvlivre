name: Atualizar webcams ao vivo

# Os links de câmeras ao vivo do YouTube mudam quando a transmissão reinicia.
# A cada 3 horas, procura as câmeras que estão no ar e grava listas/webcams.json.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webcams
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Procurar câmeras ao vivo
        run: python3 ferramentas/webcams.py listas/webcams.json

      - name: Salvar no repositório se mudou
        run: |
          git config user.name "tvlivre-bot"
          git config user.email "tvlivre-bot@users.noreply.github.com"
          git add listas/webcams.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Webcams ao vivo atualizadas em $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Outra automação pode ter salvo a lista de canais ao mesmo tempo: junta e tenta de novo.
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
