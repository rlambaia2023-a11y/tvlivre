name: Sondagem (temporário)
on:
  push:
    branches: [tmp-sonda]
jobs:
  sondar:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          python3 ferramentas/webcams.py out/webcams.json 2>&1 | tee out/log.txt
      - run: |
          cd out
          git init -q; git checkout -q -b sondagem3
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -qm sondagem
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sondagem3
