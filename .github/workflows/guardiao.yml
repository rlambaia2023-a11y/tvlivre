name: Guardião da TV

# Confere a TV a cada 4 horas. Se o servidor não responder, se a lista estiver vazia
# ou se os canais do Pluto sumirem, pede uma atualização na hora e marca a execução
# como falha (o GitHub manda um e-mail avisando). Também abre filmes do catálogo
# Filmes e séries do mesmo jeito que a TV abre.
on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir servidor, lista e Pluto TV
        if: always()
        env:
          TV: https://tela-livre-production.up.railway.app
        run: |
          set -u
          ok=1
          for i in 1 2 3; do
            if curl -fsS -m 20 "$TV/health" >/dev/null; then break; fi
            echo "Servidor não respondeu (tentativa $i)"; sleep 20
            [ "$i" = 3 ] && ok=0
          done
          curl -fsS -m 60 "$TV/canais" -o canais.json || ok=0
          total=$(jq '.total // 0' canais.json 2>/dev/null || echo 0)
          pluto=$(jq '[.canais[] | select(.id | startswith("pluto:"))] | length' canais.json 2>/dev/null || echo 0)
          echo "Canais: $total | Pluto TV: $pluto"
          if [ "$total" -lt 10 ] || [ "$pluto" -lt 1 ]; then ok=0; fi
          if [ "$ok" = 0 ]; then
            echo "Algo saiu do esperado; pedindo atualização ao servidor."
            curl -sS -m 60 "$TV/canais?forcar=1" >/dev/null || true
            exit 1
          fi

      # Confere se o Railway está rodando o mesmo código e a mesma página do main. Pega o que já
      # derrubou a TV: publicação de uma versão antiga do server.ts (rota nova some e cai na página),
      # página de reserva "Ligando a TV" no lugar da página real e página diferente da do HTML_REF.
      - name: Baixar o código (versão do servidor)
        if: always()
        uses: actions/checkout@v4
      - name: Conferir versão do servidor e da página
        if: always()
        env:
          TV: https://tela-livre-production.up.railway.app
        run: |
          set -u
          ok=1
          # 1) Toda rota do server.ts do main precisa responder algo que não seja a página da TV.
          #    Se cair na página, o Railway está com um server.ts mais antigo que o do GitHub.
          for rota in $(grep -o 'url.pathname === "/[a-z./0-9-]*"' server.ts | grep -o '"/[^"]*"' | tr -d '"'); do
            case "$rota" in /freetv|/velocidade|/vod) continue;; esac
            if [ "$rota" = /testados ]; then
              tipo=$(curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type}' -X POST -H 'content-type: application/json' -d '[]' "$TV$rota" || echo erro)
            else
              tipo=$(curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type}' "$TV$rota" || echo erro)
            fi
            # 204 (sem conteúdo) é a resposta normal do /contar.
            case "$tipo" in "204 ") echo "OK $rota (204)";;
              *text/html*|erro*|000*|5*) echo "FALHA $rota respondeu '$tipo': o Railway não tem esta rota (código antigo?)"; ok=0;;
              *) echo "OK $rota ($tipo)";; esac
          done
          # 2) A página não pode ser a reserva "Ligando a TV" (sinal de pagina_erro no servidor).
          curl -fsS -m 30 "$TV/" -o pagina.html || ok=0
          if grep -q 'Ligando a TV' pagina.html; then echo "FALHA a TV está na página de reserva"; ok=0; fi
          # 3) A página entregue precisa ser a do HTML_REF do server.ts (sem as tags dos módulos extras).
          ref=$(grep -o 'HTML_REF || "[0-9a-f]*"' server.ts | grep -o '[0-9a-f]\{40\}')
          curl -fsS -m 30 "https://raw.githubusercontent.com/rlambaia2023-a11y/tvlivre/$ref/index.html" -o esperada.html || ok=0
          sed -E 's#<script src="/extras/[^"]*"></script>##g' pagina.html > entregue.html
          if cmp -s esperada.html entregue.html; then echo "OK página igual ao commit ${ref:0:7}"
          else echo "FALHA a página no ar é diferente do commit ${ref:0:7} (variável TL_HTML_REF do Railway diferente do HTML_REF, ou página vinda do bucket)"; ok=0; fi
          # 4) Guia do Pluto com programação.
          guia=$(curl -fsS -m 30 "$TV/epg" | jq '.guia | length' 2>/dev/null || echo 0)
          echo "Guia do Pluto: $guia canais"
          if [ "$guia" -lt 1 ]; then echo "FALHA guia do Pluto vazio"; ok=0; fi
          # 5) Página da TVMH no GitHub Pages.
          pages=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' https://rlambaia2023-a11y.github.io/tvmh/ || echo erro)
          if [ "$pages" = 200 ]; then echo "OK GitHub Pages tvmh"; else echo "FALHA GitHub Pages tvmh respondeu $pages"; ok=0; fi
          [ "$ok" = 1 ] || exit 1

      # Catálogo do Pluto TV sob demanda e 3 filmes sorteados: link do título, playlist mestre
      # e variante pelo /vod/hls. Os pedaços de vídeo vão direto do Pluto para a TV no Brasil,
      # por isso não são baixados daqui (o GitHub roda fora do Brasil). Um título com problema
      # é tolerado; dois ou mais marcam falha.
      - name: Conferir Filmes e séries
        if: always()
        env:
          TV: https://tela-livre-production.up.railway.app
        run: |
          set -u
          curl -fsS -m 90 --compressed "$TV/vod" -o vod.json || { echo "Catálogo de Filmes e séries não respondeu"; exit 1; }
          cats=$(jq '.cats | length' vod.json 2>/dev/null || echo 0)
          titulos=$(jq '.itens | length' vod.json 2>/dev/null || echo 0)
          echo "Filmes e séries: $cats categorias | $titulos títulos"
          if [ "$cats" -lt 10 ] || [ "$titulos" -lt 100 ]; then echo "Catálogo menor que o esperado"; exit 1; fi
          falhas=0
          for id in $(jq -r '.itens | to_entries[] | select(.value[0] == "f") | .key' vod.json | shuf -n 3); do
            nome=$(jq -r --arg id "$id" '.itens[$id][1]' vod.json)
            url=$(curl -fsS -m 30 "$TV/vod/play?id=$id" | jq -r '.url // empty')
            if [ -z "$url" ]; then echo "FALHA $nome: sem link"; falhas=$((falhas + 1)); continue; fi
            enc=$(jq -rn --arg u "$url" '$u | @uri')
            if ! mestre=$(curl -fsS -m 30 --compressed "$TV/vod/hls?u=$enc"); then echo "FALHA $nome: playlist mestre"; falhas=$((falhas + 1)); continue; fi
            var=$(printf '%s\n' "$mestre" | grep -m1 '^/vod/hls')
            pedacos=$(curl -fsS -m 30 --compressed "$TV$var" | grep -c '^https' || true)
            if [ "${pedacos:-0}" -lt 10 ]; then echo "FALHA $nome: variante sem pedaços"; falhas=$((falhas + 1)); continue; fi
            echo "OK $nome: $pedacos pedaços"
          done
          if [ "$falhas" -gt 1 ]; then echo "$falhas filmes não abriram"; exit 1; fi

      # Lista IPTV dos Ajustes (iptv-org index.m3u): baixa pelo servidor da TV, conta as opções
      # do VLC e testa uma amostra como o botão "Testar canais", depois abre cada canal aprovado
      # pelo relay até chegar um pedaço de vídeo. O resumo aparece na página da execução.
      - name: Conferir a Lista IPTV
        if: always()
        env:
          TV: https://tela-livre-production.up.railway.app
        run: python3 ferramentas/testar_iptv.py 80
      - name: Guardar o resultado da Lista IPTV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-iptv
          path: resultado-iptv.json
          if-no-files-found: ignore
